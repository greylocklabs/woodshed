name: Release

# Pushing a v<version> tag, as `make release` does, publishes a GitHub release with that version's
# CHANGELOG.md section as its notes and the app attached. Pull requests that touch the release path run
# every step but publishing, so a broken release is caught before a tag depends on it.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - VERSION
      - CHANGELOG.md
      - app/build.gradle.kts

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Release notes
        run: scripts/release-notes.sh "$VERSION" > release-notes.md

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Tags sign with the release key, so each release installs over the last. Pull requests build unsigned.
      - name: Build the app
        env:
          KEYSTORE_BASE64: ${{ github.ref_type == 'tag' && secrets.WOODSHED_KEYSTORE_BASE64 || '' }}
          WOODSHED_KEYSTORE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.WOODSHED_KEYSTORE_PASSWORD || '' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export WOODSHED_KEYSTORE="$RUNNER_TEMP/release.p12"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "the release key secrets are missing" >&2
            exit 1
          fi
          ./gradlew :app:assembleRelease :app:bundleRelease
          if [ -n "${WOODSHED_KEYSTORE:-}" ]; then
            cp app/build/outputs/apk/release/app-release.apk "woodshed-${VERSION}.apk"
            rm -f "$RUNNER_TEMP/release.p12"
          fi

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md "woodshed-${VERSION}.apk"

      # After the GitHub release, so a Play problem never holds back the APK. Play's API cannot make an app's first
      # upload, so this waits until the service account secret exists, set up after the first bundle goes up by hand.
      - name: Check for Play upload access
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
            mkdir -p whatsnew
            scripts/play-notes.sh "$VERSION" > whatsnew/whatsnew-en-US
          fi

      - name: Upload to Play's internal testing track
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.larakelley.woodshed
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ env.VERSION }}
          track: internal
          status: completed
          whatsNewDirectory: whatsnew
