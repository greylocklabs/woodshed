name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The default also asks for "tools", which current command-line tools no longer ship.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Changelog has the current version
        run: scripts/release-notes.sh > /dev/null

      - name: Kotlin formatting
        run: ./gradlew spotlessCheck

      - name: Android lint
        run: ./gradlew lintDebug

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The default also asks for "tools", which current command-line tools no longer ship.
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Runs every unit and Robolectric test, comparing the screenshot tests against app/src/test/screenshots.
      - name: Unit, Robolectric and screenshot tests
        run: ./gradlew verifyRoborazziDebug

      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi

  commitlint:
    uses: greylocklabs/.github/.github/workflows/commitlint.yml@v1
    with:
      config: commitlint.config.cjs
