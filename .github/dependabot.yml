# Weekly update PRs for Gradle dependencies and GitHub Actions, grouped to keep the PR count low,
# and a PR whenever core releases. Commit messages read "build(deps): ..." to satisfy commitlint.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # core sets the Android Gradle plugin for every app that builds it, and Gradle allows one
    # version of it per build, so it moves when core does.
    ignore:
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
    groups:
      androidx:
        patterns: ["androidx.*", "com.android.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
      testing:
        patterns: ["junit*", "org.robolectric*", "io.github.takahirom.roborazzi*"]
      build-tools:
        patterns: ["com.diffplug.spotless*", "com.pinterest.ktlint*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # core's submodule tracks its release branch, which moves only when core tags a release.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: build
      include: scope
