<!doctype html>
<!-- Play's 1024 x 500 feature graphic, in the app's dark Callie theme. -->
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: "Fraunces"; src: url("../../www/fonts/Fraunces-Variable.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Nunito"; src: url("../../www/fonts/Nunito-Variable.ttf"); font-weight: 200 1000; }
  html, body { margin: 0; width: 1024px; height: 500px; }
  body {
    background: radial-gradient(circle at 78% 40%, #3a2530 0, #1c1220 62%);
    color: #f6eef5; font-family: "Nunito", sans-serif;
    display: flex; align-items: center; gap: 56px; padding: 0 88px; box-sizing: border-box;
  }
  img { width: 230px; height: 230px; flex: none; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45)); }
  h1 { font-family: "Fraunces", serif; font-weight: 700; font-size: 76px; line-height: 1.05; margin: 0 0 18px; letter-spacing: -0.01em; }
  h1 em { font-style: normal; color: #f08fb8; }
  p { margin: 0; font-size: 28px; font-weight: 700; color: #c9b7c6; }
</style></head>
<body>
  <img src="../../www/logo.svg" alt="">
  <div>
    <h1>Time to hit <em>the&nbsp;shed</em>.</h1>
    <p>Standards, sessions, a tuner and a drone.</p>
  </div>
</body></html>
